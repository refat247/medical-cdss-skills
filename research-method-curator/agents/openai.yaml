name: research-method-curator
version: 1.2.0
primary_skill: true
metadata:
  status: stable
  trigger_examples:
  - Audit a research report and verify its important claims.
  - Create a timestamped evidence archive for a current research update.
  - Design a source-bound RAG or CDSS benchmark method.
  required_files:
  - ACTIVATION_SMOKE_TEST.md
  - SKILL.md
  - README.md
  - CHANGELOG.md
  - references/timestamped-discovery-evidence-archive.md
  - references/notion-information-quality-standard.md
  - references/package-maintenance.md
  - references/research-method-patterns.md
  - agents/openai.yaml
  - assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
interface:
  display_name: Research Method Curator
  short_description: Audit and structure decision-grade research
  default_prompt: Use $research-method-curator to audit this research with source
    provenance, claim verification, timestamped evidence, and decision-readiness labels.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
