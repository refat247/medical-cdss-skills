name: qa
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyflakes pillow python-docx pyyaml python-pptx jsonschema pymupdf
      - name: Crash-class checks (compile, pyflakes, --help smoke)
        run: python qa/check_all.py
      - name: Per-skill tests
        run: |
          for d in */; do
            if [ -d "$d/tests" ]; then
              echo "=== $d"
              rc=0
              case "$d" in
                davidson-rag-pipeline-antigravity/)
                  # Baseline portability exception: this assertion feeds a Windows-style D:\\ path
                  # through pathlib on Linux. Keep every other Davidson test in CI.
                  (cd "$d" && python -m pytest -q -p no:cacheprovider \
                    --deselect=tests/test_run_stage_cli.py::test_derive_chapter_info_guideline_archetype) || rc=$?
                  ;;
                harrison-cdss-navigator/)
                  # Baseline environment exception: availability requires the author's local D:\\ corpus.
                  (cd "$d" && python -m pytest -q -p no:cacheprovider \
                    --deselect=tests/test_navigator.py::test_navigator_init) || rc=$?
                  ;;
                kumar-cdss-navigator/)
                  # Baseline environment exception: test_navigator.py requires local router/index assets.
                  # Contract and other self-contained Kumar tests still run.
                  (cd "$d" && python -m pytest -q -p no:cacheprovider --ignore=tests/test_navigator.py) || rc=$?
                  ;;
                *)
                  (cd "$d" && python -m pytest -q -p no:cacheprovider) || rc=$?
                  ;;
              esac
              # exit 5 = a tests/ folder with nothing to collect (e.g. fixtures only): not a failure
              if [ $rc -ne 0 ] && [ $rc -ne 5 ]; then echo "FAILED:$d" >> /tmp/failed; fi
            fi
          done
          test ! -f /tmp/failed || { cat /tmp/failed; exit 1; }
