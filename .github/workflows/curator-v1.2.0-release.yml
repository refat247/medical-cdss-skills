name: Curator v1.2.0 release unpack
on:
  push:
    branches:
      - release/notion-bilingual-book-curator-v1.2.0
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack when frozen release is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f notion-bilingual-book-curator-v1.2.0.zip ]; then exit 0; fi
          expected="c829376d9f0d1ba1aae28ca3e603b450d4cc786d97560d19ccd25c1cafb10086"
          actual="$(sha256sum notion-bilingual-book-curator-v1.2.0.zip | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf notion-bilingual-book-curator
          unzip -q notion-bilingual-book-curator-v1.2.0.zip
          test "$(find notion-bilingual-book-curator -type f | wc -l)" -eq 19
          grep -q 'version: 1.2.0' notion-bilingual-book-curator/agents/openai.yaml
          grep -q 'version: 1.2.0' notion-bilingual-book-curator/SKILL.md
          git rm -f notion-bilingual-book-curator-v1.2.0.zip
          git add notion-bilingual-book-curator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Notion Bilingual Book Curator v1.2.0"
          git push
